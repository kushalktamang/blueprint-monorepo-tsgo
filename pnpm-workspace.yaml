packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@tailwindcss/vite': ^4.3.5
  "@types/node": ^24
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
